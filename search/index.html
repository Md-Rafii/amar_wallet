<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reference Copy Search</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#e8e8e8;font-family:Arial,sans-serif;color:#333}
.page{max-width:900px;min-height:100vh;margin:20px auto;background:white;box-shadow:0 2px 10px #bbb}
.header{height:120px;background:linear-gradient(90deg,#edf4ef,#245333);display:flex;align-items:center;padding:15px 25px}
.logo{width:85px;height:85px;flex-shrink:0;border-radius:50%;background:white;border:2px solid #477052;display:flex;align-items:center;justify-content:center;text-align:center;color:#477052;font-size:10px}
.headerText{flex:1;text-align:center;color:white}
.headerText h1{font-size:21px;margin:0 0 8px}
.headerText p{margin:0;color:#e8df31;font-size:13px}
.content{padding:25px}
.back{background:#555;color:white}
.form{max-width:480px;margin:30px auto}
h2{text-align:center;color:#39704c;margin-bottom:30px}
label{display:block;margin:18px 0 7px;font-size:14px}
input{width:100%;padding:13px;border:1px solid #bbb;border-radius:4px;font-size:16px}
.search{width:100%;margin-top:22px;background:#249b52;color:white}
.search:disabled{opacity:.6}
.note{text-align:center;font-size:12px;color:#777;line-height:1.6}
.toast{display:none;position:fixed;bottom:25px;left:50%;transform:translateX(-50%);padding:12px 18px;background:#333;color:white;border-radius:5px;max-width:90%;text-align:center}
@media(max-width:600px){.page{margin:0}.header{height:110px;padding:10px 15px}.logo{width:70px;height:70px}.headerText h1{font-size:16px}.content{padding:20px}}
</style>
</head>

<body>
<div class="page">
  <header class="header">
    <div class="logo">YOUR<br>LOGO</div>
    <div class="headerText">
      <h1>Information Portal</h1>
      <p>Digital Information System</p>
    </div>
  </header>

  <div class="content">
    <button class="back" type="button" onclick="goBack()">← Dashboard</button>

    <div class="form">
      <h2>Reference Copy</h2>

      <form id="searchForm">
        <label for="reference">Reference Number</label>
        <input id="reference" name="reference" type="text"
               placeholder="Enter reference number" required>

        <label for="dob">Date of Birth</label>
        <input id="dob" name="dob" type="date" required>

        <button id="searchButton" class="search" type="submit">
          Search
        </button>
      </form>

      <p class="note">
        API সফল হলে পরবর্তী Report Page-এ যাবে।<br>
        API ব্যর্থ হলে কোনো coin কাটা হবে না।
      </p>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
/*
  তোমার আসল API URL এখানে বসাবে।
  উদাহরণ: https://api.example.com/search

  API-কে success:true এবং data object ফেরত দিতে হবে।
*/
const API_URL = "https://YOUR-API-SERVER.com/api/search";

function goBack(){
  window.location.href = "../index.html";
}

function showToast(message){
  const toast = document.getElementById("toast");
  toast.textContent = message;
  toast.style.display = "block";
  clearTimeout(window.toastTimer);
  window.toastTimer = setTimeout(() => {
    toast.style.display = "none";
  }, 3000);
}

document.getElementById("searchForm").addEventListener("submit", async function(event){
  event.preventDefault();

  const reference = document.getElementById("reference").value.trim();
  const dob = document.getElementById("dob").value;
  const button = document.getElementById("searchButton");

  if(!reference || !dob){
    showToast("Reference Number এবং জন্মতারিখ দিন");
    return;
  }

  if(API_URL.includes("YOUR-API-SERVER")){
    showToast("আগে আসল API URL বসাও");
    return;
  }

  button.disabled = true;
  button.textContent = "Searching...";

  try {
    const url = API_URL
      + "?reference=" + encodeURIComponent(reference)
      + "&dob=" + encodeURIComponent(dob);

    const response = await fetch(url, {
      method: "GET",
      headers: { "Accept": "application/json" }
    });

    if(!response.ok) throw new Error("API_FAILED");

    const result = await response.json();

    if(result.success !== true || !result.data){
      throw new Error("API_FAILED");
    }

    /*
      শুধু সফল response-এর data পরের পেজের জন্য রাখছি।
      এখনো কোনো coin deduction করা হচ্ছে না।
    */
    sessionStorage.setItem("reportData", JSON.stringify({
      ...result.data,
      reference: reference,
      dob: result.data.dob || dob
    }));

    /*
      পরের ধাপে report/index.html তৈরি হলে
      এই navigation কাজ করবে।
    */
    window.location.href = "../report/index.html";

  } catch(error) {
    console.error(error);
    showToast("API server off");
  } finally {
    button.disabled = false;
    button.textContent = "Search";
  }
});
</script>
</body>
</html>
