<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reference Search</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#eee;font-family:Arial,sans-serif;color:#333}
.page{max-width:900px;min-height:100vh;margin:auto;background:white}
.header{padding:20px;display:flex;align-items:center;gap:18px;background:linear-gradient(90deg,#edf4ef,#245333);color:white}
.logo{width:65px;height:65px;flex-shrink:0;border-radius:50%;background:white;color:#245333;display:grid;place-items:center;font-size:11px}
.headerText{text-align:center;flex:1}
.headerText h2{margin:0 0 7px;font-size:20px}
.headerText p{margin:0;color:#f3e65a;font-size:12px}
.content{padding:25px 20px}
.back{background:#555;color:white}
.form{max-width:480px;margin:30px auto}
.form h3{text-align:center;color:#245333;margin-bottom:30px}
label.field{display:block;margin:18px 0 7px;font-size:14px}
input[type=text],input[type=date]{width:100%;padding:13px;border:1px solid #bbb;border-radius:5px;font-size:16px}
.searchBtn{width:100%;padding:13px;margin-top:22px;background:#168548;color:white}
.searchBtn:disabled{opacity:.6}
.note{text-align:center;font-size:12px;color:#777;line-height:1.6}
.toast{display:none;position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#333;color:white;padding:12px 18px;border-radius:5px;max-width:90%}
</style>
</head>
<body>
<div class="page">
<header class="header">
  <div class="logo">YOUR LOGO</div>
  <div class="headerText">
    <h2>Information Portal</h2>
    <p>Digital Information System</p>
  </div>
</header>

<div class="content">
<button class="back" onclick="location.href='../index.html'">← Dashboard</button>

<div class="form">
<h3>Reference Copy</h3>

<form id="searchForm">
  <label class="field" for="reference">Reference Number</label>
  <input id="reference" type="text" placeholder="Enter reference number" required>

  <label class="field" for="dob">Date of Birth</label>
  <input id="dob" type="date" required>

  <button id="searchBtn" class="searchBtn" type="submit">Search</button>
</form>

<p class="note" id="modeNote"></p>
</div>
</div>
</div>

<div id="toast" class="toast"></div>

<script>
const API_URL="https://YOUR-API-SERVER.com/api/search";

function toast(message){
  const el=document.getElementById("toast");
  el.textContent=message;
  el.style.display="block";
  clearTimeout(window.toastTimer);
  window.toastTimer=setTimeout(()=>el.style.display="none",3000);
}

function updateNote(){
  const demo=localStorage.getItem("demoMode")==="on";
  document.getElementById("modeNote").textContent=demo
    ?"Demo Mode চালু — কল্পিত পরীক্ষামূলক তথ্য ব্যবহার হবে।"
    :"Demo Mode বন্ধ — আসল API ব্যবহার হবে।";
}
updateNote();

document.getElementById("searchForm").addEventListener("submit",async function(e){
  e.preventDefault();

  const reference=document.getElementById("reference").value.trim();
  const dob=document.getElementById("dob").value;
  const btn=document.getElementById("searchBtn");
  const demo=localStorage.getItem("demoMode")==="on";

  btn.disabled=true;
  btn.textContent="Searching...";

  try{
    let data;

    if(demo){
      data={
        id:"DEMO-"+reference,
        reference,
        dob,
        nameBn:"উদাহরণ ব্যবহারকারী",
        nameEn:"DEMO USER",
        father:"উদাহরণ পিতা",
        mother:"উদাহরণ মাতা",
        blood:"O+",
        occupation:"Student",
        other:"Demo information only",
        presentAddress:"Demo Present Address",
        permanentAddress:"Demo Permanent Address",
        photo:"",
        demo:true
      };
    }else{
      if(API_URL.includes("YOUR-API-SERVER")){
        throw new Error("API_NOT_CONFIGURED");
      }

      const url=API_URL+
        "?reference="+encodeURIComponent(reference)+
        "&dob="+encodeURIComponent(dob);

      const response=await fetch(url,{
        headers:{"Accept":"application/json"}
      });

      if(!response.ok)throw new Error("API_FAILED");

      const result=await response.json();
      if(result.success!==true||!result.data)throw new Error("API_FAILED");

      data={...result.data,reference,dob:result.data.dob||dob,demo:false};
    }

    sessionStorage.setItem("reportData",JSON.stringify(data));

    /*
      Report page পরে তৈরি হলে নিচের লাইনটি চালু করবে:
      location.href="../report/index.html";
    */

    toast(demo
      ?"Demo Search সফল। Report page পরে যোগ হবে।"
      :"API সফল। Report page পরে যোগ হবে।");

  }catch(err){
    console.error(err);
    toast(err.message==="API_NOT_CONFIGURED"
      ?"আগে API URL বসাও"
      :"API server off");
  }finally{
    btn.disabled=false;
    btn.textContent="Search";
  }
});
</script>
</body>
</html>
