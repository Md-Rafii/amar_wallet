<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Information Search</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 15px;
      background: #e7e7e7;
      font-family: Arial, sans-serif;
      color: #333;
    }

    .container {
      max-width: 850px;
      min-height: 600px;
      margin: auto;
      background: white;
      box-shadow: 0 1px 8px #bbb;
    }

    .header {
      background: linear-gradient(#b9c8bb, #214b32);
      color: white;
      min-height: 150px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }

    .header h2 {
      font-size: 22px;
      font-weight: 500;
      margin: 0 0 8px;
    }

    .header p {
      color: #fff36a;
      margin: 0;
      font-size: 14px;
    }

    .content {
      max-width: 550px;
      margin: 35px auto;
      padding: 20px;
    }

    h3 {
      text-align: center;
      font-size: 16px;
      font-weight: normal;
      color: #79516c;
    }

    label {
      display: block;
      margin: 16px 0 6px;
      font-size: 13px;
    }

    input {
      width: 100%;
      padding: 11px;
      border: 1px solid #ccc;
      border-radius: 3px;
      font-size: 14px;
    }

    button {
      border: none;
      border-radius: 3px;
      padding: 11px 20px;
      color: white;
      background: #229b50;
      cursor: pointer;
      margin-top: 20px;
    }

    button:disabled { opacity: .6; cursor: wait; }

    .search-btn { width: 100%; }

    .back-btn {
      display: block;
      margin: 20px auto;
      background: #555;
    }

    .note {
      text-align: center;
      color: #777;
      font-size: 12px;
      margin-top: 20px;
    }
  </style>
</head>

<body>
  <div class="container">

    <header class="header">
      <div>
        <h2>Bangladesh Information Portal</h2>
        <p>Digital Information Registration System</p>
      </div>
    </header>

    <main class="content">
      <h3>Select Your Search Category</h3>

      <form id="searchForm">
        <label for="reference">Reference No.</label>
        <input
          id="reference"
          type="text"
          placeholder="Enter Reference Number"
          required
        >

        <label for="searchDate">Date</label>
        <input id="searchDate" type="date" required>

        <button id="searchBtn" class="search-btn" type="submit">Search</button>
      </form>

      <p class="note" id="modeNote">
        Demo mode — Search opens the report page.
      </p>

      <button class="back-btn" type="button"
        onclick="location.href='../index.html'">
        Back
      </button>
    </main>

  </div>

  <script>

    /* =====================================================
       CONFIG  (এখানে শুধু এই অংশটুকু বদলাবে)
    ===================================================== */

    const CONFIG = {

      // true = demo data (নাম: Rafit), false = তোমার API call হবে
      DEMO_MODE: true,

      // তোমার নিজের API-এর URL
      API_URL: "https://YOUR-API-URL/report",

      // GET বা POST
      METHOD: "GET",

      // API সর্বোচ্চ কত সেকেন্ড অপেক্ষা করবে
      TIMEOUT_SEC: 20,

      // Report পেজের path
      REPORT_PAGE: "../report/index.html"
    };


    /* =====================================================
       DEMO DATA  (নাম Rafit, বাকি সব demo)
    ===================================================== */

    function buildDemoData(reference, date) {
      return {
        photo: null,            // null হলে report পেজের demo ছবি বসবে
        qr: null,               // null হলে report পেজের demo QR বসবে
        personName: "RAFIT HOSSAIN",
        idNumber: "DEMO-000001",
        reference: reference,
        birthPlace: "Example District",
        nameBn: "রাফিত হোসেন",
        nameEn: "RAFIT HOSSAIN",
        dob: formatDate(date),
        father: "জামাল হোসেন",
        mother: "নাজমা আক্তার",
        blood: "A+",
        spouse: "-",
        occupation: "Student",
        other: "Demo Information",
        presentAddress: "বাসা/হোল্ডিংঃ ৭৮, গ্রাম/রাস্তাঃ, মৌজা/মহল্লাঃ, ইউনিয়ন/ওয়ার্ডঃ, পোষ্ট অফিসঃ শ্যামপুর, পোষ্ট কোডঃ ৩৫০০, উপজেলাঃ কসবা, জেলাঃ ব্রাহ্মণবাড়িয়া, অঞ্চলঃ, বিভাগঃ চট্টগ্রাম,",
        permanentAddress: "বাসা/হোল্ডিংঃ ৭৮, গ্রাম/রাস্তাঃ, মৌজা/মহল্লাঃ, ইউনিয়ন/ওয়ার্ডঃ, পোষ্ট অফিসঃ শ্যামপুর, পোষ্ট কোডঃ ৩৫০০, উপজেলাঃ কসবা, জেলাঃ ব্রাহ্মণবাড়িয়া, অঞ্চলঃ, বিভাগঃ চট্টগ্রাম,"
      };
    }


    /* =====================================================
       API RESPONSE → REPORT FORMAT
       তোমার API-র key-এর নাম যা, ডান পাশে সেটা লিখবে
    ===================================================== */

    function mapApiToReport(api, reference, date) {
      return {
        photo:            api.photo,              // ছবির URL বা base64
        qr:               api.qr,                 // QR-এর URL বা base64
        personName:       api.name_en,
        idNumber:         api.id_number,
        reference:        api.reference || reference,
        birthPlace:       api.birth_place,
        nameBn:           api.name_bn,
        nameEn:           api.name_en,
        dob:              api.date_of_birth,
        father:           api.father_name,
        mother:           api.mother_name,
        blood:            api.blood_group,
        spouse:           api.spouse_name,
        occupation:       api.occupation,
        other:            api.other,
        presentAddress:   api.present_address,
        permanentAddress: api.permanent_address
      };
    }


    /* =====================================================
       API CALL
    ===================================================== */

    async function callApi(reference, date) {

      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), CONFIG.TIMEOUT_SEC * 1000);

      try {

        let response;

        if (CONFIG.METHOD === "POST") {

          response = await fetch(CONFIG.API_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ reference: reference, date: date }),
            signal: controller.signal
          });

        } else {

          const url = CONFIG.API_URL +
            "?reference=" + encodeURIComponent(reference) +
            "&date=" + encodeURIComponent(date);

          response = await fetch(url, { signal: controller.signal });
        }

        if (!response.ok) {
          throw new Error("API error: " + response.status);
        }

        const json = await response.json();

        // API যদি { data: {...} } আকারে পাঠায়
        const api = json.data || json;

        if (!api || Object.keys(api).length === 0) {
          throw new Error("EMPTY");
        }

        return mapApiToReport(api, reference, date);

      } finally {
        clearTimeout(timer);
      }
    }


    /* =====================================================
       HELPERS
    ===================================================== */

    function formatDate(value) {
      if (!value) return "-";
      const d = new Date(value);
      if (isNaN(d)) return value;
      return d.toLocaleDateString("en-GB", {
        day: "2-digit", month: "short", year: "numeric"
      });
    }


    /* =====================================================
       FORM SUBMIT
    ===================================================== */

    document.getElementById("modeNote").textContent = CONFIG.DEMO_MODE
      ? "Demo mode — Search opens the report page."
      : "Search opens the report page.";

    document.getElementById("searchForm").addEventListener("submit", async function (event) {
      event.preventDefault();

      const reference = document.getElementById("reference").value.trim();
      const date = document.getElementById("searchDate").value;

      if (!reference || !date) {
        alert("Reference Number এবং Date লিখুন।");
        return;
      }

      const button = document.getElementById("searchBtn");
      button.disabled = true;
      button.textContent = "Searching...";

      try {

        const reportData = CONFIG.DEMO_MODE
          ? buildDemoData(reference, date)
          : await callApi(reference, date);

        // Report পেজের জন্য তথ্য সেভ (storage বন্ধ থাকলেও যেন সমস্যা না হয়)
        const json = JSON.stringify(reportData);

        try {
          sessionStorage.setItem("reportReference", reference);
          sessionStorage.setItem("reportDate", date);
          sessionStorage.setItem("reportData", json);
        } catch (e) {}

        try {
          localStorage.setItem("reportData", json);
        } catch (e) {}

        // URL-এও তথ্য পাঠানো (বড় ছবি/QR বাদ দিয়ে)
        const small = { ...reportData };
        if (small.photo && small.photo.length > 2000) small.photo = null;
        if (small.qr && small.qr.length > 2000) small.qr = null;
        const packed = btoa(unescape(encodeURIComponent(JSON.stringify(small))));

        window.location.href =
          CONFIG.REPORT_PAGE +
          "?reference=" + encodeURIComponent(reference) +
          "&date=" + encodeURIComponent(date) +
          "&d=" + encodeURIComponent(packed);

      } catch (error) {

        console.error(error);

        if (error.message === "EMPTY") {
          alert("কোনো তথ্য পাওয়া যায়নি।");
        } else if (error.name === "AbortError") {
          alert("সময় শেষ হয়ে গেছে, আবার চেষ্টা করুন।");
        } else {
          alert("তথ্য আনতে সমস্যা হয়েছে, আবার চেষ্টা করুন।");
        }

        button.disabled = false;
        button.textContent = "Search";
      }
    });

  </script>
</body>
</html>
