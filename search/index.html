<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Information Search</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 15px;
      background: #e7e7e7;
      font-family: Arial, sans-serif;
      color: #333;
    }

    .container {
      max-width: 850px;
      min-height: 600px;
      margin: auto;
      background: white;
      box-shadow: 0 1px 8px #bbb;
    }

    .header {
      background: linear-gradient(#b9c8bb, #214b32);
      color: white;
      min-height: 150px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }

    .header h2 {
      font-size: 22px;
      font-weight: 500;
      margin: 0 0 8px;
    }

    .header p {
      color: #fff36a;
      margin: 0;
      font-size: 14px;
    }

    .content {
      max-width: 550px;
      margin: 35px auto;
      padding: 20px;
    }

    h3 {
      text-align: center;
      font-size: 16px;
      font-weight: normal;
      color: #79516c;
    }

    label {
      display: block;
      margin: 16px 0 6px;
      font-size: 13px;
    }

    input {
      width: 100%;
      padding: 11px;
      border: 1px solid #ccc;
      border-radius: 3px;
      font-size: 14px;
    }

    button {
      border: none;
      border-radius: 3px;
      padding: 11px 20px;
      color: white;
      background: #229b50;
      cursor: pointer;
      margin-top: 20px;
    }

    .search-btn {
      width: 100%;
    }

    .back-btn {
      display: block;
      margin: 20px auto;
      background: #555;
    }

    .note {
      text-align: center;
      color: #777;
      font-size: 12px;
      margin-top: 20px;
    }
  </style>
</head>

<body>
  <div class="container">

    <header class="header">
      <div>
        <h2>Bangladesh Information Portal</h2>
        <p>Digital Information Registration System</p>
      </div>
    </header>

    <main class="content">
      <h3>Select Your Search Category</h3>

      <form id="searchForm">
        <label for="reference">Reference No.</label>
        <input
          id="reference"
          type="text"
          placeholder="Enter Reference Number"
          required
        >

        <label for="searchDate">Date</label>
        <input id="searchDate" type="date" required>

        <button class="search-btn" type="submit">Search</button>
      </form>

      <p class="note">
        Demo mode — Search opens the report page.
      </p>

      <button class="back-btn" type="button"
        onclick="location.href='../index.html'">
        Back
      </button>
    </main>

  </div>

  <script>
    document.getElementById("searchForm").addEventListener("submit", function(event) {
      event.preventDefault();

      const reference = document.getElementById("reference").value.trim();
      const date = document.getElementById("searchDate").value;

      if (!reference || !date) {
        alert("Reference Number এবং Date লিখুন।");
        return;
      }

      // Demo search details save
      sessionStorage.setItem("reportReference", reference);
      sessionStorage.setItem("reportDate", date);

      // Open report/index.html
      window.location.href =
        "../report/index.html?reference=" +
        encodeURIComponent(reference) +
        "&date=" +
        encodeURIComponent(date);
    });
  </script>
</body>
</html>
