<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Information Portal</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:30px 0;
    background:#f3f3f3;
    font-family:Arial, "Noto Sans Bengali", sans-serif;
}

/* Main report width */
.portal{
    width:1170px;
    max-width:94%;
    margin:auto;
    background:#fff;
    border:1px solid #ddd;
}

/* =========================
   HEADER
========================= */

.header{
    height:165px;
    position:relative;
    overflow:hidden;

    background:
        linear-gradient(
            to bottom,
            #aebfaf 0%,
            #728a76 42%,
            #1f4229 100%
        );
}

/* subtle highlight */
.header::after{
    content:"";
    position:absolute;
    left:0;
    right:0;
    top:0;
    height:100%;
    background:
        linear-gradient(
            180deg,
            rgba(255,255,255,.22),
            transparent 35%,
            rgba(0,0,0,.12)
        );
    pointer-events:none;
}

/* Logo area */

.logo-area{
    position:absolute;
    left:0;
    top:0;
    width:165px;
    height:165px;

    background:#e9eee9;

    border-radius:0 85px 85px 0;

    display:flex;
    align-items:center;
    justify-content:center;

    z-index:2;
}

.logo-placeholder{
    width:82px;
    height:82px;

    border-radius:50%;

    background:#ffffff;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#23623a;
    font-size:12px;
    font-weight:bold;
    text-align:center;

    border:3px solid #2d7045;
}

/* Header text */

.header-content{
    position:absolute;

    left:165px;
    right:0;
    top:0;
    bottom:0;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    z-index:2;
}

.header-title{
    margin:0;

    color:#fff;

    font-size:36px;
    font-weight:bold;

    letter-spacing:.2px;

    text-shadow:
        1px 2px 3px rgba(0,0,0,.35);
}

.header-subtitle{
    margin-top:7px;

    color:#f0df35;

    font-size:23px;
    font-weight:bold;

    text-shadow:
        1px 2px 2px rgba(0,0,0,.3);
}


/* =========================
   SEARCH AREA
========================= */

.search-area{
    position:relative;

    height:180px;

    background:#fff;

    text-align:center;

    padding-top:8px;
}

.menu-button{
    position:absolute;

    right:14px;
    top:8px;

    background:#1478d4;

    color:#fff;

    border:0;

    padding:9px 18px;

    font-size:13px;

    cursor:pointer;
}

.search-heading{
    margin:0 0 7px;

    color:#a1436e;

    font-size:20px;

    font-weight:bold;
}

.search-option{
    color:#468f7d;

    font-size:17px;

    line-height:28px;
}

.search-option input{
    vertical-align:middle;
    margin-right:6px;
}

.search-form{
    margin-top:14px;

    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
}

.search-label{
    color:#a63d4b;

    font-weight:bold;

    font-size:17px;
}

.search-input{
    width:220px;

    height:35px;

    border:1px solid #ddd;

    padding:7px 10px;

    font-size:15px;

    outline:none;
}

.search-input:focus{
    border-color:#aaa;
}

.search-button{
    height:35px;

    padding:0 22px;

    border:0;

    border-radius:2px;

    background:#20a54a;

    color:#fff;

    font-weight:bold;

    cursor:pointer;
}

.search-button:hover{
    background:#168d3c;
}


/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    body{
        padding:10px 0;
    }

    .portal{
        max-width:98%;
    }

    .header{
        height:115px;
    }

    .logo-area{
        width:110px;
        height:115px;
        border-radius:0 60px 60px 0;
    }

    .logo-placeholder{
        width:60px;
        height:60px;
        font-size:9px;
    }

    .header-content{
        left:105px;
    }

    .header-title{
        font-size:20px;
        text-align:center;
    }

    .header-subtitle{
        font-size:13px;
        text-align:center;
    }

    .search-area{
        height:170px;
    }

    .search-heading{
        font-size:16px;
    }

    .search-option{
        font-size:14px;
    }

    .search-form{
        flex-wrap:wrap;
        gap:6px;
    }

    .search-label{
        font-size:14px;
    }

    .search-input{
        width:140px;
    }
}
</style>
</head>


<body>

<div class="portal">

    <!-- HEADER -->

    <div class="header">

        <!-- পরে এখানে নিজের logo বসাবে -->
        <div class="logo-area">

            <div class="logo-placeholder">
                YOUR<br>LOGO
            </div>

        </div>


        <div class="header-content">

            <h1 class="header-title">
                Bangladesh Information Portal
            </h1>

            <div class="header-subtitle">
                Digital Information Registration System
            </div>

        </div>

    </div>


    <!-- SEARCH -->

    <div class="search-area">

        <button class="menu-button">
            Menu
        </button>


        <h2 class="search-heading">
            Select Your Search Category
        </h2>


        <div class="search-option">

            <label>
                <input
                    type="radio"
                    name="searchType"
                    value="id"
                    checked
                >

                Search by ID / Reference No.
            </label>

        </div>


        <div class="search-option">

            <label>
                <input
                    type="radio"
                    name="searchType"
                    value="form"
                >

                Search by Form No.
            </label>

        </div>


        <div class="search-form">

            <span class="search-label">
                ID or Reference No*
            </span>

            <input
                class="search-input"
                type="text"
                placeholder="Enter ID"
                id="searchInput"
            >

            <button
                class="search-button"
                onclick="searchData()"
            >
                Search
            </button>

        </div>

    </div>

</div>


<script>

function searchData(){

    const value =
        document.getElementById("searchInput").value.trim();

    if(!value){
        alert("Please enter an ID or reference number.");
        return;
    }

    console.log("Search:", value);

}

</script>

</body>
</html>
